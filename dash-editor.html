<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PowerTune Page Editor</title>
<style>
  :root {
    --bg: #f4f4f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #d9d9d4;
    --accent: #2b6cb0; --sel: #f6ad55; --danger: #c53030;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --panel: #212120; --ink: #ececea; --muted: #9a9a94; --line: #3a3a37;
      --accent: #63a4e8; --sel: #f6ad55; --danger: #fc8181; }
  }
  /* The dash's own font, from the backup (used when the page can read files next to it). */
  @font-face { font-family: "Nissan"; src: url("../dash-files/usr/share/fonts/PowertuneDigital/Nissan.ttf"); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px;
    border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0 12px 0 0; }
  button, select, input { font: inherit; color: inherit; }
  button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; border-color: var(--line); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--danger); }
  label.file { display: inline-block; }
  label.file input { display: none; }
  .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; padding: 16px; }
  @media (max-width: 1100px) { main { grid-template-columns: minmax(0,1fr); } }
  .stagewrap { overflow: auto; }
  #stage { position: relative; width: 800px; height: 480px; background: #000; overflow: hidden;
    outline: 1px solid var(--line); transform-origin: 0 0; user-select: none; }
  #stage .g { position: absolute; cursor: move; }
  #stage .g.sel { outline: 2px dashed var(--sel); outline-offset: 1px; z-index: 1000; }
  #stage .g.hidden { outline: 1px dotted #666; }
  /* the dash uses PreserveAspectFit for page backgrounds */
  #stage img.bgimg { position: absolute; inset: 0; width: 800px; height: 480px; object-fit: contain; pointer-events: none; }
  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 10px; color: var(--muted); }
  aside { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; align-self: start; }
  aside h2 { font-size: 14px; margin: 0 0 8px; }
  .row { display: grid; grid-template-columns: 110px 1fr; gap: 6px; align-items: center; margin-bottom: 6px; }
  .row input, .row select { width: 100%; padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); }
  .muted { color: var(--muted); }
  ul#list { list-style: none; margin: 8px 0 0; padding: 0; max-height: 260px; overflow: auto; border-top: 1px solid var(--line); }
  ul#list li { padding: 4px 6px; cursor: pointer; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  ul#list li.sel { background: color-mix(in srgb, var(--sel) 25%, transparent); }
  #msg { min-height: 1.4em; color: var(--muted); }
  #selBtns { margin-top: 8px; display: flex; gap: 6px; }
  [hidden] { display: none !important; }
  details { margin-top: 10px; }
  details textarea { width: 100%; height: 120px; font: 12px ui-monospace, Consolas, monospace; background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
</style>
</head>
<body>
<header>
  <h1>PowerTune Page Editor</h1>
  <label class="file"><input type="file" id="openTxt" accept=".txt"><button type="button" onclick="this.previousElementSibling.click()">Open page .txt</button></label>
  <label class="file"><input type="file" id="openConf" accept=".conf"><button type="button" onclick="this.previousElementSibling.click()">Open live pages (PowerTune.conf)</button></label>
  <select id="confPage" hidden></select>
  <label class="file"><input type="file" id="openImgs" webkitdirectory multiple><button type="button" onclick="this.previousElementSibling.click()" title="Pick dash-files/home/pi/Logo">Images folder…</button></label>
  <span class="sep"></span>
  <button id="addText">+ Text</button>
  <button id="addValue">+ Value</button>
  <button id="addSquare">+ Square</button>
  <span class="sep"></span>
  <button id="undo" title="Undo (Ctrl+Z)">Undo</button>
  <button id="redo" title="Redo (Ctrl+Y)">Redo</button>
  <span class="sep"></span>
  <input id="fname" value="MyDash" size="14" title="File name to save as">
  <button class="primary" id="save">Save .txt</button>
</header>

<main>
  <section>
    <div class="stagewrap"><div id="stage"></div></div>
    <div class="bar">
      <span>RPM preview <input type="range" id="rpm" min="0" max="9000" step="50" value="3000"> <b id="rpmv">3000</b></span>
      <span>Background <select id="bg"><option value="">black</option></select></span>
      <span>Zoom <select id="zoom"><option value="fit" selected>Fit</option><option>1</option><option>1.25</option><option>1.5</option><option>2</option></select></span>
    </div>
    <p id="msg"></p>
  </section>

  <aside>
    <h2 id="selTitle">Nothing selected</h2>
    <div id="props" class="muted">Click a gauge on the screen or in the list. Drag to move; arrow keys nudge (Shift = 10px). Delete removes.</div>
    <div id="selBtns" hidden>
      <button id="dup">Duplicate</button><button id="del" class="danger">Delete</button>
    </div>
    <ul id="list"></ul>
    <details><summary class="muted">Raw file text</summary><textarea id="raw" readonly></textarea></details>
  </aside>
</main>

<datalist id="dslist"></datalist>

function clearHistory() { undoStack.length = 0; redoStack.length = 0; lastChange = null; updateUndoButtons(); }
function updateUndoButtons() { $("undo").disabled = !undoStack.length; $("redo").disabled = !redoStack.length; }
// Images come from dash-files/home/pi/Logo next to this page, or from a folder
// picked with "Images folder…" (needed where relative files can't be read).
const pickedImages = {};
function logoUrl(name) { return pickedImages[name] || LOGO_DIR + encodeURIComponent(name); }
function picUrl(p) { if (!p) return ""; const m = /\/home\/pi\/Logo\/(.+)$/.exec(p); return m ? logoUrl(decodeURIComponent(m[1])) : ""; }
let imgHintShown = false;
function imgFailed() {
  if (imgHintShown || Object.keys(pickedImages).length) return;
  imgHintShown = true;
  msg("Images can't be read from here. Click \"Images folder…\" and pick dash-files/home/pi/Logo, or open dash-editor.html in Chrome/Edge.");
}

// Sample values so the preview looks alive.
function sample(src) {
  if (!src || !src.trim()) return null;
  const s = src.toLowerCase(), rpm = num($("rpm").value);
  if (s === "rpm") return rpm;
  if (s.includes("afr")) return 14.7;
  if (s === "lambda") return 1.0;
  if (s.startsWith("egt")) return 650;
  if (s.includes("water") || s.includes("oiltemp")) return 88;
  if (s.includes("speed")) return Math.round(rpm / 60);
  if (s.includes("batt")) return 13.8;
  if (s === "odo") return 150095.8;
  return 42;
}

// ---------------------------------------------------------------- parse / emit
function parseTxt(text) {
  const out = [], skipped = [];
  for (const line of text.split(/\r?\n/)) {
    if (!line.trim()) continue;
    const parts = line.split(",");
    const type = parts.shift();
    if (!FIELDS[type]) skipped.push(type);
    out.push({ type, cols: parts });
  }
  return { out, skipped };
}
function emitTxt() { return gauges.map(g => [g.type, ...g.cols].join(",")).join("\n") + "\n"; }

// Page backgrounds are separate QSettings values, e.g.
// savebackroundpicture1=@Variant(\0\0\0\x11\0\0\0'file:///home/pi/Logo/Perfect%20Dash.png)
function parseBackgrounds(text) {
  const bgs = {};
  for (const m of text.matchAll(/^savebackroundpicture(\d)=.*?file:\/\/\/home\/pi\/Logo\/([^)\r\n]+)\)/gm))
    bgs["datastore" + m[1]] = decodeURIComponent(m[2]);
  return bgs;
}
function parseConf(text) {
  const pages = {};
  for (const line of text.split(/\r?\n/)) {
    const m = /^(datastore\d)="(.*)"$/.exec(line);
    if (!m || !m[2]) continue;
    // QSettings escapes: \" and \\ ; JSON itself is inside.
    const json = m[2].replace(/\\(["\\])/g, "$1");
    try { pages[m[1]] = JSON.parse(json); } catch (e) { console.warn(m[1], e); }
  }
  return pages;
}
function jsonToGauge(o) {
  const cols = JSON_COLS[o.info];
  if (!cols) return null;
  const out = cols.map(k => k[0] === "*" ? k.slice(1) : (o[k] === undefined ? "" : String(o[k])));
  // Match what the dash's own Export writes, so files look the same either way.
  if (o.info === "Text label gauge" || o.info === "Square gauge") out.push("");
  if (o.info === "Round gauge") {
    const blank = [" ", "", " ", "", " ", "", ""], start = cols.indexOf("peakneedlecolor");
    blank.forEach((b, j) => { if (out[start + j] === "") out[start + j] = b; });
  }
  return { type: o.info, cols: out };
}

// ---------------------------------------------------------------- render
function render() {
  stage.innerHTML = "";
  const bg = $("bg").value;
  if (bg) { const im = new Image(); im.className = "bgimg"; im.onerror = imgFailed; im.src = logoUrl(bg); stage.appendChild(im); }
  gauges.forEach((g, i) => {
    const el = drawGauge(g);
    el.classList.add("g");
    if (i === sel) el.classList.add("sel");
    el.dataset.i = i;
    el.style.zIndex = i + 1;
    stage.appendChild(el);
  });
  renderList();
  $("raw").value = emitTxt();
}

function drawGauge(g) {
  const el = document.createElement("div");
  const x = num(f(g, "x")), y = num(f(g, "y"));
  el.style.left = x + "px"; el.style.top = y + "px";
  const t = g.type;
  if (t === "Text label gauge") {
    const src = (f(g, "source") || "").trim();
    const v = sample(src);
    el.textContent = v === null ? f(g, "text") : v.toFixed(Math.max(0, num(f(g, "dec"))));
    el.style.color = f(g, "color") || "white";
    el.style.fontSize = num(f(g, "size"), 15) * PT_TO_PX + "px";
    el.style.fontFamily = `"${f(g, "font")}", sans-serif`;
    el.style.fontWeight = f(g, "bold") === "true" ? "700" : "400";
    el.style.whiteSpace = "pre";
    el.style.lineHeight = "1.2";
    if (!el.textContent.trim()) { el.textContent = "·"; el.classList.add("hidden"); }
  } else if (t === "Square gauge") {
    const w = num(f(g, "w"), 100), h = num(f(g, "h"), 60);
    Object.assign(el.style, { width: w + "px", height: h + "px",
      border: "2px solid " + cssc(f(g, "frame")), background: cssc(f(g, "bgc")), color: f(g, "color") || "white" });
    const title = document.createElement("div");
    title.textContent = (f(g, "title") || "").trim() || "\u00a0";
    Object.assign(title.style, { fontSize: num(f(g, "titlesize"), 14) + "px", background: cssc(f(g, "titlebg")),
      color: cssc(f(g, "titlecolor"), "white"), padding: "0 4px" });
    const val = document.createElement("div");
    const v = sample(f(g, "source"));
    val.textContent = v === null ? "—" : v.toFixed(Math.max(0, num(f(g, "dec"))));
    // Squaregauge.qml centres the value on the whole gauge, not below the title.
    Object.assign(val.style, { position: "absolute", inset: "0", display: "flex", alignItems: "center", justifyContent: "center",
      fontSize: Math.min(num(f(g, "size"), 40), h * 0.8) + "px", fontFamily: `"${f(g, "vfont")}", sans-serif` });
    el.append(title, val);
    // Unit: pinned 5px from the right edge, 1/1.8 of the value size (Squaregauge.qml).
    const unitText = (f(g, "unit") || "").trim();
    if (unitText) {
      const u = document.createElement("div");
      u.textContent = unitText;
      Object.assign(u.style, { position: "absolute", right: "5px", top: "0", bottom: "0", display: "flex", alignItems: "center",
        fontSize: num(f(g, "size"), 40) / 1.8 + "px", fontWeight: "700", fontFamily: `"${f(g, "font")}", sans-serif`,
        color: f(g, "color") || "white" });
      el.appendChild(u);
    }
    if (cssc(f(g, "frame")) === "transparent" && cssc(f(g, "bgc")) === "transparent") el.classList.add("hidden");
  } else if (t === "Round gauge") {
    const w = num(f(g, "w"), 200);
    el.style.width = el.style.height = w + "px";
    const a0 = num(f(g, "start"), -135), a1 = num(f(g, "end"), 135);
    const mn = num(f(g, "min")), mx = num(f(g, "max"), 1);
    const v = sample(f(g, "source")) ?? mn;
    const a = a0 + (a1 - a0) * Math.min(1, Math.max(0, (v - mn) / ((mx - mn) || 1)));
    const r = w / 2, pt = (ang, rr) => { const t = (ang - 90) * Math.PI / 180; return [r + rr * Math.cos(t), r + rr * Math.sin(t)]; };
    const [sx, sy] = pt(a0, r - 3), [ex, ey] = pt(a1, r - 3);
    // Needle as RoundGauge.qml draws it: the item's y = radius × inset%, so its base sits
    // -inset% out from the centre and the tip a further length% out; it tapers from
    // width% of the radius at the base to tipWidth px at the tip.
    const rBase = -r * num(f(g, "ninset")) / 100, rTip = rBase + r * num(f(g, "nlen"), 85) / 100;
    const bw = Math.max(2, r * num(f(g, "nbase"), 2) / 100), tw = Math.max(1, num(g.cols[29], 2));
    const side = (rr, hw, s) => { const t = (a - 90) * Math.PI / 180, [px, py] = pt(a, rr);
      return `${px - s * hw * Math.sin(t)},${py + s * hw * Math.cos(t)}`; };
    const needlePts = [side(rBase, bw / 2, 1), side(rTip, tw / 2, 1), side(rTip, tw / 2, -1), side(rBase, bw / 2, -1)].join(" ");
    const large = Math.abs(a1 - a0) > 180 ? 1 : 0;
    el.innerHTML = `<svg width="${w}" height="${w}" viewBox="0 0 ${w} ${w}">
      <path d="M${sx},${sy} A${r - 3},${r - 3} 0 ${large} 1 ${ex},${ey}" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="4 4"/>
      <polygon points="${needlePts}" fill="${cssc(f(g, "needle"), "red")}"/></svg>`;
  } else if (t === "State gauge" || t === "State GIF" || t === "gauge image") {
    const h = num(f(g, "h"), 50);
    const on = t === "gauge image" ? true : (sample(f(g, "source")) ?? 0) >= num(f(g, "trigger"));
    const src = picUrl(t === "gauge image" ? f(g, "pic") : (on ? f(g, "on") : f(g, "off")));
    // The dash draws these in an h×h box with the picture scaled to fit (Statepicture.qml).
    Object.assign(el.style, { width: h + "px", height: h + "px" });
    if (src) {
      const im = new Image(); im.onerror = imgFailed; im.src = src; im.draggable = false;
      Object.assign(im.style, { width: "100%", height: "100%", objectFit: "contain", display: "block" });
      el.appendChild(im);
    } else {
      el.classList.add("hidden");
    }
  } else if (t === "Bar gauge") {
    Object.assign(el.style, { width: num(f(g, "w"), 30) + "px", height: num(f(g, "h"), 100) + "px", border: "1px solid #888" });
  } else {
    el.textContent = t; Object.assign(el.style, { color: "#f88", fontSize: "11px" });
  }
  return el;
}
function cssc(c, d = "transparent") { c = (c || "").trim(); return c || d; }
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function describe(g) {
  const src = (f(g, "source") || "").trim();
  const label = g.type === "Text label gauge" ? (src ? (dsName[src] || src) : `"${f(g, "text")}"`)
    : g.type === "Square gauge" ? `${(f(g, "title") || "").trim() || "—"} · ${dsName[src] || src}`
    : src ? (dsName[src] || src) : "";
  return `${g.type.replace(" gauge", "")}: ${label}`;
}
function renderList() {
  const ul = $("list"); ul.innerHTML = "";
  gauges.forEach((g, i) => {
    const li = document.createElement("li"); li.textContent = describe(g);
    if (i === sel) li.className = "sel";
    li.onclick = () => select(i); ul.appendChild(li);
  });
}

// ---------------------------------------------------------------- properties
function select(i) { if (i !== sel) lastChange = null; sel = i; render(); renderProps(); }
function renderProps() {
  const p = $("props"), g = gauges[sel];
  $("selBtns").hidden = !g;
  if (!g) { $("selTitle").textContent = "Nothing selected"; p.className = "muted";
    p.textContent = "Click a gauge on the screen or in the list. Drag to move; arrow keys nudge (Shift = 10px). Delete removes."; return; }
  $("selTitle").textContent = g.type; p.className = ""; p.innerHTML = "";
  for (const k of Object.keys(FIELDS[g.type] || {})) {
    const row = document.createElement("div"); row.className = "row";
    const lab = document.createElement("label"); lab.textContent = LABELS[k] || k;
    if (k === "size") lab.textContent += g.type === "Text label gauge" ? " (pt)" : " (px)";
    let inp;
    if (k === "bold") {
      inp = document.createElement("select"); inp.innerHTML = "<option>true</option><option>false</option>";
    } else {
      inp = document.createElement("input");
      if (SOURCE_KEYS.includes(k)) inp.setAttribute("list", "dslist");
      if (["x","y","w","h","size","titlesize","dec","max","min","trigger","start","end"].includes(k)) inp.type = "number";
    }
    inp.value = (f(g, k) ?? "").trim() === "" && !SOURCE_KEYS.includes(k) ? (f(g, k) ?? "") : (f(g, k) ?? "").trim();
    inp.oninput = () => {
      let v = inp.value.replace(/,/g, " ");          // commas would break the file
      if (SOURCE_KEYS.includes(k) && !v) v = " ";     // dash uses a single space for "none"
      remember(`edit:${sel}:${k}`);
      setf(g, k, v); render();
      if (SOURCE_KEYS.includes(k)) hint.textContent = dsName[v.trim()] ? dsName[v.trim()] : (v.trim() ? "unknown channel" : "");
    };
    row.append(lab, inp); p.appendChild(row);
    let hint;
    if (SOURCE_KEYS.includes(k)) {
      hint = document.createElement("div"); hint.className = "muted"; hint.style.gridColumn = "2";
      const v = (f(g, k) || "").trim(); hint.textContent = dsName[v] || (v ? "unknown channel" : "");
      row.appendChild(hint);
    }
  }
}

// ---------------------------------------------------------------- dragging
let drag = null;
stage.addEventListener("pointerdown", e => {
  const el = e.target.closest(".g"); if (!el) { select(-1); return; }
  const i = +el.dataset.i; if (i !== sel) select(i);
  const g = gauges[i], z = zoom();
  drag = { g, sx: e.clientX, sy: e.clientY, x: num(f(g, "x")), y: num(f(g, "y")), z };
  stage.setPointerCapture(e.pointerId); e.preventDefault();
});
stage.addEventListener("pointermove", e => {
  if (!drag) return;
  if (!drag.moved) { remember(); drag.moved = true; }
  setf(drag.g, "x", String(Math.round(drag.x + (e.clientX - drag.sx) / drag.z)));
  setf(drag.g, "y", String(Math.round(drag.y + (e.clientY - drag.sy) / drag.z)));
  const el = stage.querySelector(`.g[data-i="${sel}"]`);
  if (el) { el.style.left = f(drag.g, "x") + "px"; el.style.top = f(drag.g, "y") + "px"; }
});
stage.addEventListener("pointerup", () => { if (drag) { drag = null; render(); renderProps(); } });
document.addEventListener("keydown", e => {
  if (/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;   // let text boxes keep their own undo
  const key = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && key === "z") { e.shiftKey ? redo() : undo(); e.preventDefault(); return; }
  if ((e.ctrlKey || e.metaKey) && key === "y") { redo(); e.preventDefault(); return; }
  if (sel < 0) return;
  const g = gauges[sel], s = e.shiftKey ? 10 : 1;
  const mv = { ArrowLeft: [-s, 0], ArrowRight: [s, 0], ArrowUp: [0, -s], ArrowDown: [0, s] }[e.key];
  if (mv) { remember("nudge:" + sel); setf(g, "x", String(Math.round(num(f(g, "x")) + mv[0]))); setf(g, "y", String(Math.round(num(f(g, "y")) + mv[1])));
    render(); renderProps(); e.preventDefault(); }
  if (e.key === "Delete") { $("del").click(); e.preventDefault(); }
});

// ---------------------------------------------------------------- toolbar
function load(list, label) { gauges = list; sel = -1; clearHistory(); render(); renderProps(); msg(label); }
$("openTxt").onchange = async e => {
  const file = e.target.files[0]; if (!file) return;
  const { out, skipped } = parseTxt(await file.text());
  $("fname").value = file.name.replace(/\.txt$/i, "");
  $("confPage").hidden = true;
  load(out, `Opened ${file.name}: ${out.length} gauges.` + (skipped.length ? ` Not previewed (kept as-is): ${[...new Set(skipped)].join(", ")}.` : ""));
  e.target.value = "";
};
let confPages = {};
$("openConf").onchange = async e => {
  const file = e.target.files[0]; if (!file) return;
  const text = await file.text();
  confPages = parseConf(text);
  const confBgs = parseBackgrounds(text);
  const keys = Object.keys(confPages);
  if (!keys.length) { msg(`No dash pages in ${file.name}. Pick dash-files/PowerTune-live-pages.conf (about 66 KB) instead.`); return; }
  const cp = $("confPage"); cp.innerHTML = keys.map(k => `<option value="${k}">Page ${k.slice(-1)}</option>`).join(""); cp.hidden = false;
  cp.onchange = () => {
    const items = confPages[cp.value], list = [], skipped = [];
    for (const o of items) { const g = jsonToGauge(o); g ? list.push(g) : skipped.push(o.info); }
    $("fname").value = "Page" + cp.value.slice(-1);
    const bg = confBgs[cp.value] || "";
    $("bg").value = [...$("bg").options].some(o => o.value === bg) ? bg : "";
    load(list, `Live page ${cp.value.slice(-1)}: ${list.length} gauges` + (bg ? `, background ${bg}.` : ".") + (skipped.length ? ` Skipped (unknown layout): ${[...new Set(skipped)].join(", ")}.` : ""));
  };
  cp.onchange(); e.target.value = "";
};
$("openImgs").onchange = e => {
  let n = 0;
  for (const file of e.target.files) {
    if (!/\.png$/i.test(file.name)) continue;
    if (pickedImages[file.name]) URL.revokeObjectURL(pickedImages[file.name]);
    pickedImages[file.name] = URL.createObjectURL(file); n++;
    if (![...$("bg").options].some(o => o.value === file.name))
      $("bg").insertAdjacentHTML("beforeend", `<option value="${esc(file.name)}">${esc(file.name.replace(/\.png$/i, ""))}</option>`);
  }
  render(); msg(n ? `Loaded ${n} images.` : "No PNG images in that folder. Pick dash-files/home/pi/Logo.");
  e.target.value = "";
};
function add(g) { remember(); gauges.push(g); select(gauges.length - 1); }
$("undo").onclick = undo;
$("redo").onclick = redo;
$("addText").onclick = () => add({ type: "Text label gauge", cols: ["350","200","LABEL","Lato","15","white"," ","true","0","20000","-20000",""] });
$("addValue").onclick = () => add({ type: "Text label gauge", cols: ["350","230","0","Lato","15","white","egt2","true","0","20000","-20000",""] });
$("addSquare").onclick = () => add({ type: "Square gauge", cols: ["200","100","300","190","100","0"," ","EGT","false","false","false","Dashboard","egt2","egt2","10000","-20000","white","black","grey","white","white","blue","18","50","0","Lato","Lato"] });
$("dup").onclick = () => { const g = gauges[sel]; if (!g) return; const c = { type: g.type, cols: [...g.cols] };
  if (FIELDS[c.type].x !== undefined) { setf(c, "x", String(num(f(c, "x")) + 10)); setf(c, "y", String(num(f(c, "y")) + 10)); } add(c); };
$("del").onclick = () => { if (sel < 0) return; remember(); gauges.splice(sel, 1); sel = -1; render(); renderProps(); };
$("save").onclick = () => {
  const name = ($("fname").value.trim() || "MyDash").replace(/[^\w\- ]/g, "_") + ".txt";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([emitTxt()], { type: "text/plain" }));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
  msg(`Saved ${name}. Copy it to /home/pi/UserDashboards on the dash, then on the dash: double-tap → Clear → Import → pick it → Load → Save.`);
};
$("rpm").oninput = () => { $("rpmv").textContent = $("rpm").value; render(); };
function zoom() {
  const v = $("zoom").value;
  return v === "fit" ? Math.min(2, (stage.parentNode.parentNode.clientWidth - 4) / 800) : num(v, 1);
}
$("zoom").onchange = () => { const z = zoom(); stage.style.transform = `scale(${z})`;
  stage.parentNode.style.height = 480 * z + 2 + "px"; stage.parentNode.style.maxWidth = 800 * z + 2 + "px"; };
window.addEventListener("resize", () => $("zoom").onchange());
$("bg").onchange = render;

// background choices: every PNG in the dash's Logo folder (logos.js)
for (const n of (typeof LOGO_FILES !== "undefined" ? LOGO_FILES : []))
  $("bg").insertAdjacentHTML("beforeend", `<option value="${esc(n)}">${esc(n.replace(/\.png$/, ""))}</option>`);
$("dslist").innerHTML = DS.map(d => `<option value="${esc(d.s)}">${esc(d.t)}${d.u ? " (" + esc(d.u) + ")" : ""}</option>`).join("");
$("zoom").onchange();
updateUndoButtons();
render();
msg(DS.length ? `Ready. ${DS.length} channels loaded. Open a page .txt from dash-files/home/pi/UserDashboards, or open the live pages from dash-files/PowerTune-live-pages.conf.`
  : "datasources.js missing: the channel list won't autocomplete.");
</script>
</body>
